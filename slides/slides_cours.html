<h2 id="pourquoi-ce-cours-insiste-sur-le-traitement">Pourquoi ce cours insiste sur le <em>traitement</em></h2>
<ul>
<li>Dans un projet réel, <strong>la majorité du temps</strong> part dans la collecte, le nettoyage et la mise en forme.</li>
<li>Un modèle sophistiqué sur des données sales donne des <strong>conclusions fausses</strong> avec beaucoup d'assurance.</li>
<li><em>Garbage in, garbage out.</em></li>
</ul>
<p>Fil rouge : des données <strong>simulées</strong> inspirées du Sénégal — ventes de boutiques, météo de Dakar, enquête ménages, résultats d'étudiants, clients mobile money.</p>
<footer>Analyse et traitement des données — Issa Gueye</footer>

<h2 id="le-cycle-crisp-dm">Le cycle CRISP-DM</h2>
<ol>
<li><strong>Compréhension métier</strong> — quelle question ? quel critère de succès ?</li>
<li><strong>Compréhension des données</strong> — sources, qualité, biais</li>
<li><strong>Préparation</strong> — nettoyage, transformation, variables</li>
<li><strong>Modélisation</strong></li>
<li><strong>Évaluation</strong> — répond-on à la question ?</li>
<li><strong>Déploiement</strong> — rapport, tableau de bord, automatisation</li>
</ol>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Processus <strong>itératif</strong> : on revient souvent en arrière.</p>

<h2 id="tidy-data-wickham-2014">Tidy data (Wickham, 2014)</h2>
<ol>
<li>Chaque <strong>variable</strong> est une <strong>colonne</strong></li>
<li>Chaque <strong>observation</strong> est une <strong>ligne</strong></li>
<li>Chaque <strong>type d'unité</strong> forme une <strong>table</strong></li>
</ol>
<p>C'est le format attendu par pandas, seaborn et scikit-learn.<br />
<code>melt</code> (large → long) et <code>pivot</code> (long → large) permettent d'y arriver.</p>
<footer>Analyse et traitement des données — Issa Gueye</footer>

<h2 id="dimensions-de-la-qualit%C3%A9">Dimensions de la qualité</h2>
<table>
<thead>
<tr>
<th>Dimension</th>
<th>Défaut typique</th>
</tr>
</thead>
<tbody>
<tr>
<td>Complétude</td>
<td>revenu non déclaré</td>
</tr>
<tr>
<td>Validité</td>
<td>quantité négative, température −99 °C</td>
</tr>
<tr>
<td>Exactitude</td>
<td>999 saisi au lieu de 9</td>
</tr>
<tr>
<td>Cohérence</td>
<td>« Dakar », « dakar », « DAKAR »</td>
</tr>

<h2 id="numpy--vectoriser">NumPy : vectoriser</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">prix = np.array([<span class="hljs-number">12500</span>, <span class="hljs-number">6500</span>, <span class="hljs-number">700</span>, <span class="hljs-number">2300</span>])
qte  = np.array([[<span class="hljs-number">3</span>, <span class="hljs-number">2</span>, <span class="hljs-number">10</span>, <span class="hljs-number">4</span>],
                 [<span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">25</span>, <span class="hljs-number">2</span>]])           <span class="hljs-comment"># 2 boutiques × 4 produits</span>
ca = qte * prix                            <span class="hljs-comment"># broadcasting (2,4) * (4,)</span>
ca.<span class="hljs-built_in">sum</span>(axis=<span class="hljs-number">1</span>)                             <span class="hljs-comment"># CA par boutique</span>
Z = (X - X.mean(axis=<span class="hljs-number">0</span>)) / X.std(axis=<span class="hljs-number">0</span>, ddof=<span class="hljs-number">1</span>)
</code></pre>
<ul>
<li>Opérations en C, sans boucle Python : <strong>10 à 100× plus rapide</strong></li>
<li>Broadcasting : comparer les formes <strong>de droite à gauche</strong> (égales ou 1)</li>
<li><code>rng = np.random.default_rng(42)</code> : aléatoire <strong>reproductible</strong></li>
</ul>

<h2 id="pipeline-scikit-learn">Pipeline scikit-learn</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">prep = ColumnTransformer([
  (<span class="hljs-string">&quot;num&quot;</span>, make_pipeline(SimpleImputer(strategy=<span class="hljs-string">&quot;median&quot;</span>), StandardScaler()), num),
  (<span class="hljs-string">&quot;nom&quot;</span>, make_pipeline(SimpleImputer(strategy=<span class="hljs-string">&quot;most_frequent&quot;</span>),
                        OneHotEncoder(handle_unknown=<span class="hljs-string">&quot;ignore&quot;</span>)), cat),
])
modele = make_pipeline(prep, LogisticRegression())
cross_val_score(modele, X_train, y_train, cv=<span class="hljs-number">5</span>, scoring=<span class="hljs-string">&quot;roc_auc&quot;</span>)
</code></pre>
<p>Un seul objet : pas de fuite, sauvegardable, applicable aux données brutes.</p>

<h2 id="clustering">Clustering</h2>
<ul>
<li><strong>k-means</strong> : minimise l'inertie intra ; standardiser ; <code>n_init=10</code></li>
<li>Choisir k : coude, <strong>silhouette</strong>, <strong>interprétabilité</strong></li>
<li>Dans notre exemple, la silhouette propose k = 3 alors que 4 profils existent : les critères <strong>aident</strong>, ils ne décident pas</li>
<li><strong>Profiler et nommer</strong> les segments : c'est là que se crée la valeur métier</li>
<li>Alternatives : CAH Ward, DBSCAN, mélanges gaussiens</li>
</ul>
